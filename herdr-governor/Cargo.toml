[package]
name = "herdr-governor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Durable daemon that launches coding agents into Herdr panes and supervises Runs to Settlement"

[dependencies]
governor-core = { path = "../governor-core", version = "0.1.0" }
# reqwest 0.12 + rustls-tls-native-roots-no-provider + explicit rustls dep:
# OS root store + aws-lc-rs provider. Enabling neither ring, webpki-roots
# (MPL-2.0), nor rustls-platform-verifier (jni pins syn 2) keeps
# clippy::multiple_crate_versions and cargo-deny clean where we control the
# choice. rustls-webpki still pin-locks its optional `ring` dep (unused);
# see the P4.D0 report for the residual windows-sys conflict.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots-no-provider", "json"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "io-util", "time", "sync", "process", "fs"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }

[lints]
workspace = true
