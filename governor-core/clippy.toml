disallowed-macros = [
  # Under #![no_std] these macros resolve through core:: — the std:: spellings
  # are dead entries and would never fire. include!/#[path] resist this layer
  # either way (built-in macros expand before lint resolution) — the lexical
  # scan rejects them; keep the ban list honest.
  { path = "core::env", reason = "governor-core is pure — build-time env reads make values depend on the build host" },
  { path = "core::option_env", reason = "governor-core is pure — build-time env reads make values depend on the build host" },
  { path = "core::include_bytes", reason = "governor-core is pure — no file content smuggled past the src scan" },
  { path = "core::include_str", reason = "governor-core is pure — no file content smuggled past the src scan" },
]
# disallowed-macros exists too ({ path, reason, replacement }); the panic/dbg/print lints above
# already cover the usual suspects — add entries only when a real pattern recurs.
disallowed-names = ["..", "tmp", "tmp2", "data2", "flag2"]  # ".." appends to clippy's default ["foo","baz","quux"]
