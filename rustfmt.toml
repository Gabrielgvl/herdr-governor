edition = "2024"  # match crate edition
max_width = 100
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
newline_style = "Unix"
# Nightly-only, if you choose to run `cargo +nightly fmt` (mark speculative until CI does):
# imports_granularity = "Crate"
# group_imports = "StdExternalCrate"
# wrap_comments = true
# format_code_in_doc_comments = true
# comment_width = 100
